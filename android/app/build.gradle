plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {

    signingConfigs {
        release {
            storeFile file('upload-keystore.jks')
            storePassword 'PiggyVault2026SecuredKey'
            keyAlias 'piggykey'
            keyPassword 'PiggyVault2026SecuredKey'
        }
    }

    namespace "com.porcellino.app"
    compileSdk 34

    compileOptions {
        coreLibraryDesugaringEnabled true
        
        
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        multiDexEnabled true
        applicationId "com.example.family_budget_app"
        minSdkVersion 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

apply plugin: 'com.google.gms.google-services'
// Aggiunta forzata per risolvere il bug di Gradle
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

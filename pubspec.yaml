name: family_budget_app
description: "Porcellino - Gestione Finanziaria Personale e Condivisa"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:

  package_info_plus: any
  url_launcher: any
  dio: any
  path_provider: any
  open_filex: any
  flutter_local_notifications: ^17.2.0
  firebase_auth: ^4.17.8
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

dev_dependencies:

  package_info_plus: any
  url_launcher: any
  dio: any
  path_provider: any
  open_filex: any
  flutter_local_notifications: ^17.2.0
  flutter_test:
    sdk: flutter
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/piggy_ai_assistant.png
    - assets/icon/icona_esterna.png


flutter_launcher_icons:
  image_path: "assets/icon/icona_esterna.png"
  android: true
  ios: false
  min_sdk_android: 21

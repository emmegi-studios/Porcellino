name: porcellino
description: "Porcellino - Il caveau finanziario intelligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "assets/icon/icona_esterna.png"
  android: true
  ios: false
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icona_esterna.png

flutter_icons:
  image_path: "assets/icon/icona_esterna.png"
  android: true
  ios: true

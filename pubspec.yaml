name: porcellino
description: "Porcellino - Il caveau finanziario intelligente"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "assets/icon/icona_esterna.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icona_esterna.png

name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Generate Icons
        run: |
          flutter pub get
          # no-op

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        run: |
          echo "Caricamento in corso su Pixeldrain..."
          RESPONSE=$(curl -s -T build/app/outputs/flutter-apk/app-release.apk https://pixeldrain.com/api/file/)
          echo "$RESPONSE"
          FILE_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*' | head -n 1 | cut -d'"' -f4)
          echo "========================================="
          echo "✅ SCARICA L'APK DA QUI: https://pixeldrain.com/u/$FILE_ID"
          echo "========================================="

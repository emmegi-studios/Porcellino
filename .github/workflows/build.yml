name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Force Custom Icon into Android Resources
      run: |
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        
        if [ -f "assets/icon/icona_esterna.png" ]; then
          cp assets/icon/icona_esterna.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon/icona_esterna.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon/icona_esterna.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon/icona_esterna.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon/icona_esterna.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Icona personalizzata applicata con successo alle risorse mipmap!"
        else
          echo "Attenzione: icona_esterna.png non trovata nella cartella assets/icon"
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: porcellino-apk
        path: build/app/outputs/flutter-apk/app-release.apk

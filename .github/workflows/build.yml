name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Generate Icons
        run: |
          flutter pub get
          # no-op

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        run: |
          echo "Caricamento in corso..."
          curl -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://file.io
          echo "========================================="
          echo "✅ Copia il link 'link' dalla risposta sopra!"
          echo "========================================="

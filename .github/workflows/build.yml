name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload to BashUpload
        run: |
          echo "Caricamento in corso su BashUpload..."
          curl -T build/app/outputs/flutter-apk/app-release.apk https://bashupload.com/PiggyVault.apk
          echo ""
          echo "========================================="
          echo "✅ IL LINK DI DOWNLOAD È STAMPATO QUI SOPRA!"
          echo "========================================="
